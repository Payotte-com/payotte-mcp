name = "payotte-mcp"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Palier gratuit Cloudflare Workers : 100 000 requêtes/jour — largement suffisant.
# URL après déploiement : https://payotte-mcp.<sous-domaine>.workers.dev/mcp

# Compteurs anti-abus + comptage « leads IA » (agrégats seulement, jamais de contenu).
[[kv_namespaces]]
binding = "COUNTERS"
id = "773969ab7f814cdf8985b2f0e7edaf8d"

# Secrets attendus (wrangler secret put …) :
#   CONTACTS_TOKEN  — jeton du fichier /api/cx/{token}.json (src/lib/contactsToken.ts côté site)
#   RESEND_API_KEY  — clé API Resend ; ABSENTE = mode répétition (aucun envoi, réponse simulée)
[vars]
MAIL_FROM = "Payotte <relais@payotte.com>"
MAIL_FROM_BULLETIN = "Payotte <bulletin@payotte.com>"

# Abonnés au bulletin de marché mensuel (clé s:{ville}:{courriel} → {email, city, lang, consent}).
[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "6b341a2d876b49d78bb5651936ccac8e"

# Bulletin : cycle MENSUEL, servi à 10 H CHEZ LE DESTINATAIRE (décision proprio, 5 août 2026).
# Une heure UTC unique arrivait à 6 h du matin sur la côte Ouest. Le worker se réveille donc à
# chaque heure de la fenêtre et ne sert QUE les provinces où il est alors 10 h passé — le tri
# se fait dans le code (PROV_TZ / zonesAt10h), en fuseaux IANA, donc l'heure avancée et la
# Saskatchewan qui ne la suit jamais se règlent toutes seules.
#
# 12-18 h UTC couvre les 10 h locales de tout le pays, été comme hiver :
#   été   → NL 12:30 · AT 13 h · ET 14 h · CT 15 h · SK/MT 16 h · PT 17 h
#   hiver → NL 13:30 · AT 14 h · ET 15 h · CT/SK 16 h · MT 17 h · PT 18 h
# (Terre-Neuve et sa demi-heure : c'est le passage suivant, à 10 h 30 locale, qui la sert.)
# Six passages sur sept ne trouvent aucune province dans la tranche et s'arrêtent aussitôt.
#
# Deux plafonds se cumulent : le plan gratuit Cloudflare (50 sous-requêtes par exécution) et le
# rythme quotidien, global à TOUS les passages de la journée — voir le compteur `day:` en KV,
# sans quoi 7 passages feraient 7 fois le plafond. Ce rythme n'est PAS une constante : c'est
# une montée en charge datée, dans `dailySendCap()` (src/index.js) — 50/jour, puis 70 à partir
# du 15 août, 90 à partir du 22. Un domaine jeune qui saute d'un coup à 90 finit en spam ;
# c'est la seule raison d'être de ces paliers. La valeur du jour se lit dans le code, jamais
# ici — ce commentaire a déjà menti une fois (il annonçait 20 alors que le code servait 50).
# La vague mensuelle (~455 destinataires) s'étale ainsi sur environ trois semaines. Une fois
# tout le monde servi, plus rien jusqu'au 1er.
[triggers]
crons = ["0 12-18 * * *"]
