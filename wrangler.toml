name = "payotte-mcp"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Palier gratuit Cloudflare Workers : 100 000 requêtes/jour — largement suffisant.
# URL après déploiement : https://payotte-mcp.<sous-domaine>.workers.dev/mcp

# Compteurs anti-abus + comptage « leads IA » (agrégats seulement, jamais de contenu).
[[kv_namespaces]]
binding = "COUNTERS"
id = "773969ab7f814cdf8985b2f0e7edaf8d"

# Secrets attendus (wrangler secret put …) :
#   CONTACTS_TOKEN  — jeton du fichier /api/cx/{token}.json (src/lib/contactsToken.ts côté site)
#   RESEND_API_KEY  — clé API Resend ; ABSENTE = mode répétition (aucun envoi, réponse simulée)
[vars]
MAIL_FROM = "Payotte <relais@payotte.com>"
MAIL_FROM_BULLETIN = "Payotte <bulletin@payotte.com>"

# ── EXPÉDITEUR DE LA PROSPECTION (posé le 9 sept. 2026) ──────────────────────────
# Le code route par flux depuis le 19 août (`sendPulseBatch`, « trois expéditeurs, trois
# réputations ») — mais la variable n'avait JAMAIS été posée. `MAIL_FROM_OUTREACH` étant
# absente, la ligne retombait sur `MAIL_FROM_BULLETIN` : les 50 courriels du 9 septembre,
# tous de la prospection, sont partis de `bulletin@`. La séparation existait dans le code
# et nulle part ailleurs, et la rampe de chauffe chauffait l'adresse du bulletin opt-in —
# exactement ce qu'elle était censée protéger.
#
# ⚠️ `outreach@payotte.com`, PAS `outreach.payotte.com`. Un commentaire du code parlait
# d'un sous-domaine ; il n'existe pas — `dig TXT resend._domainkey.outreach.payotte.com`
# et `dig MX outreach.payotte.com` ne rendent rien (vérifié le 9 sept. 2026). Le domaine
# vérifié chez Resend est `payotte.com`, celui d'où partent déjà `bulletin@` et `relais@`,
# et `outreach@` y est redirigé par ImprovMX comme les trois autres. Poser un sous-domaine
# non vérifié ici ferait refuser TOUS les envois de prospection par Resend.
MAIL_FROM_OUTREACH = "Payotte <outreach@payotte.com>"

# ── RAMPE DE LA PROSPECTION — TOUT LE FLUX `outreach`, 2026-09-02 ────────────────
# ⚠️ CE BLOC A DÉCRIT LE CONTRAIRE DU CODE PENDANT UNE SEMAINE. Il annonçait un
# « sous-plafond des experts seulement », calibré à ~30 % de la rampe globale pour vider
# les 622 experts en quatre jours, et concluait : « après le 11, le chiffre n'a plus
# d'effet — il n'y a plus d'expert à servir ». D'où l'absence de tout palier après le 16.
#
# Or `rampeOutreach()` (src/index.js) borne `fluxRec === 'outreach'`, et ça comprend les
# 11 839 PROSPECTS RÉCOLTÉS. Un plafond dimensionné pour 622 personnes étranglait donc
# tout le programme à 30 % du plan, et le plafond de 600 devenait éternel : 7 575 servis
# au 30 septembre sur 12 366, 4 791 jamais joints, et le cycle qui repart à zéro le
# 1er octobre. Le carnet n'était JAMAIS vidé. Mesuré et corrigé le 9 septembre 2026.
#
# Les experts n'y perdent rien : c'est `EXPERTS_SHARE = 0.30` qui leur réserve 30 % de
# chaque passage — la protection existait en double, et c'est l'autre qui compte.
#
# PALIERS PROLONGÉS LE 9 SEPT. 2026, en DOUBLANT à chaque marche (75 → 150 → 300 → 600
# → 1 200 → 2 400 → 4 800). C'est la doctrine du 3 août tenue à la lettre, et c'est plus
# prudent que la rampe globale, qui ferait passer de 50 le 9 à 500 le 10 — un ×10 sur un
# domaine dont le meilleur jour de sa vie est 90. Le minimum des deux rampes s'applique,
# donc le vrai débit sera 150 · 300 · 600 · 1 000 · 2 000 · 4 000 : carnet vide le
# vendredi 18 septembre, la date du plan de septembre.
#
# ⚠️ CE N'EST PAS UN ENGAGEMENT DE DÉBIT : les seuils de `runBulletin` posent
# `stop:outreach` tout seuls si les plaintes passent 0,3 % ou les rebonds durs 4 %. Un
# palier qui déclenche l'arrêt n'est pas à forcer — reprendre au palier PRÉCÉDENT.
#
# ⚠ REDATÉE LE 8 SEPT. 2026, DE DEUX JOURS — et la raison n'est pas cosmétique.
# Les paliers partaient du 7 septembre. Or RIEN n'est parti : la pause du 2 septembre
# (`dailySendCap` rend 0) tenait toujours, et la rampe globale a elle aussi été redatée
# pour repartir de 250 le mercredi 9. Laissées au 7, ces bornes auraient compté deux
# jours de réputation qui n'ont jamais existé : au 9 septembre elles autorisaient 225
# courriels depuis un sous-domaine qui n'en a JAMAIS expédié un seul — précisément le
# « 0 à 400 d'un coup se fait classer en pourriel » que le commentaire ci-dessus met en
# garde. Le premier jour d'envoi réel doit être le premier jour de chauffe.
#
# ⚠ ET ÇA SE REPRODUIRA à chaque report de la reprise. Ces dates sont ABSOLUES, comme
# celles de `dailySendCap` : tout report de l'envoi oblige à redater LES DEUX. Le jour
# où ça arrive une troisième fois, remplacer les deux par un décalage en jours ouvrables
# depuis une seule constante de départ.
# ⚠ DÉROGATION AUX 10 H LOCALES : POSÉE PUIS RETIRÉE LE MÊME JOUR (8 sept. 2026).
# Elle valait pour le 8 seulement — or le cron s'arrête à 18 h UTC (14 h EDT) et elle a
# été déployée à 18 h 15. Elle n'aurait JAMAIS pu s'exécuter : du réglage mort. Le code
# qui la lit reste en place dans `runBulletin` (une ligne, inerte tant que la variable
# est absente) ; c'est la variable qui part.
# POUR S'EN RESERVIR UN JOUR : reposer ZONES_TOUTES_JUSQU_AU avec une date FUTURE, et
# la poser AVANT 12 h UTC, sinon la journée est déjà passée.

# ── PASSAGES DE RENFORT POUR LE QUÉBEC ET L'ONTARIO (18 sept. 2026) ─────────────
# LE DÉBIT N'EST PAS BRIDÉ PAR UN PLAFOND, mais par le budget de 880 opérations KV
# d'UNE invocation : la boucle des prospects paie une lecture par candidat examiné, donc
# un passage ne regarde jamais plus de ~680 personnes. Mesuré le 18 septembre : 4 800
# autorisés, 703 partis, et le passage de 14 h UTC — celui qui porte QC+ON, 5 534
# personnes en attente, 70 % du carnet restant — en a sorti 189.
#
# La règle des 10 h locales ne donne qu'UN passage par province et par jour. Le cron
# tourne pourtant de 12 à 18 h UTC, et les heures 12 et 18 ne servent PERSONNE : aucune
# province n'est à 10 h locale à ce moment-là. Deux invocations par jour repartaient avec
# leur budget de 880 intact. C'est cette capacité-là qu'on récupère, et rien d'autre : le
# plafond quotidien ne bouge pas, c'est le PARTAGE qui change.
#
# ⚠ SEULEMENT DES PROVINCES DE L'EST, ET C'EST LA RAISON D'ÊTRE DU RÉGLAGE.
#   18 h UTC = 14 h à Montréal et Toronto — plein après-midi ouvrable, l'esprit de la
#            règle des 10 h est respecté à la lettre.
#   12 h UTC =  8 h de l'Est — tôt, mais ouvrable pour des professionnels de
#            l'immobilier. ⚠ DEVIENT 7 h AU PASSAGE À L'HEURE D'HIVER (1er nov. 2026) :
#            retirer « 12:QC,ON » à ce moment-là, ou l'avancer à 13 h UTC.
# NE JAMAIS y mettre une province de l'Ouest : 12 h UTC = 5 h du matin en C.-B.
#
# Format : « HH:PROV,PROV;HH:PROV » en heures UTC. Vide (ou absent) = comportement
# d'avant, un seul passage par province et par jour.
HEURES_RENFORT = "12:QC,ON;18:QC,ON"

# ── BULLETIN PROVINCIAL — INTERRUPTEUR FERMÉ (branché le 23 sept. 2026) ─────────
# Les 5 423 clés `s:prov-{province}:{courriel}` (municipalités sans chiffres de marché)
# reçoivent, une fois ouvert, le pouls de leur zone publiée (variante BANLIEUE, ~1 634)
# ou de leur province (variante PROVINCIALE, ~3 789). Code : `renderBulletinProvincial`
# et la boucle des prospects de `runBulletin` (src/index.js).
# ⚠ NE PAS OUVRIR AU PALIER GRATUIT DE WORKERS KV : 1 000 écritures/jour pour tout le
# compte, ~910 déjà consommées en moyenne en septembre. Plus de destinataires = plus
# d'écritures du webhook et de /unsubscribe, et un quota crevé fait échouer les
# désabonnements (LCAP art. 11). Ouvrir APRÈS le passage au palier payant, en retirant
# le « # » de la ligne ci-dessous, puis `npx wrangler deploy`.
PROVINCIAL_ACTIF = "1"

OUTREACH_RAMPE = "2026-09-09:75,2026-09-10:150,2026-09-11:300,2026-09-14:600,2026-09-15:1200,2026-09-16:2400,2026-09-17:4800"

# ── FORÇAGE DE PROVINCES POUR UNE JOURNÉE (14 sept. 2026, demande proprio) ───────
# QC et ON sont normalement servis au passage de 14 h UTC (10 h locale). Celui du
# 14 septembre est mort sur la limite des 1 000 opérations KV, et la journée n'avait
# plus que 17 h et 18 h UTC — deux créneaux qui ne servent que la C.-B. et personne.
# Cette variable rouvre QC et ON pour CE jour-là, à 13 h et 14 h heure de l'Est :
# des heures ouvrables, donc l'esprit de la règle des 10 h est respecté.
#
# ⚠️ ELLE S'ANNULE SEULE. La date en tête doit valoir le jour UTC courant ; demain la
# variable est inerte et le filtre par fuseau reprend sans intervention. NE PAS la
# remplacer par une liste sans date : un forçage permanent finirait par expédier à
# 6 h du matin sur la côte Ouest.
PROVINCES_DU_JOUR = "2026-09-14:QC,ON"

# ── ADRESSE POSTALE LCAP — EN SECRET, PAS ICI (2026-08-25) ───────────────────────
# Le Règlement de la LCAP (art. 2(2)) impose l'adresse postale de l'expéditeur dans TOUT
# message commercial électronique, en plus du nom et d'un moyen de contact. Le worker la
# lit par `env.ADRESSE_POSTALE` (voir `adressePostale()`), et crie au journal si elle
# manque.
#
# ⚠️ ELLE N'EST PAS ÉCRITE DANS CE FICHIER, ET C'EST DÉLIBÉRÉ. C'est une adresse
# RÉSIDENTIELLE, et ce dépôt est PUBLIC (github.com/Payotte-com/payotte-mcp). Une
# variable en clair ici la rendrait indexable, moissonnable par les robots qui ratissent
# les dépôts publics, et surtout PRÉSENTE DANS L'HISTORIQUE GIT pour toujours — la
# retirer plus tard demanderait une réécriture d'historique. Elle vit donc en SECRET
# Cloudflare, qui ne quitte jamais le compte :
#
#     npx wrangler secret put ADRESSE_POSTALE
#
# ⚠️ NE JAMAIS la remettre en `[vars]` : Cloudflare refuse d'ailleurs le doublon
# (« Binding name already in use », code 10053) — le garde-fou est réel, pas théorique.
#
# Elle doit rester VALIDE 60 JOURS après chaque envoi (exigence du Règlement).

# Abonnés au bulletin de marché mensuel (clé s:{ville}:{courriel} → {email, city, lang, consent}).
[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "6b341a2d876b49d78bb5651936ccac8e"

# Bulletin : cycle MENSUEL, servi à 10 H CHEZ LE DESTINATAIRE (décision proprio, 5 août 2026).
# Une heure UTC unique arrivait à 6 h du matin sur la côte Ouest. Le worker se réveille donc à
# chaque heure de la fenêtre et ne sert QUE les provinces où il est alors 10 h passé — le tri
# se fait dans le code (PROV_TZ / zonesAt10h), en fuseaux IANA, donc l'heure avancée et la
# Saskatchewan qui ne la suit jamais se règlent toutes seules.
#
# 12-18 h UTC couvre les 10 h locales de tout le pays, été comme hiver :
#   été   → NL 12:30 · AT 13 h · ET 14 h · CT 15 h · SK/MT 16 h · PT 17 h
#   hiver → NL 13:30 · AT 14 h · ET 15 h · CT/SK 16 h · MT 17 h · PT 18 h
# (Terre-Neuve et sa demi-heure : c'est le passage suivant, à 10 h 30 locale, qui la sert.)
# Six passages sur sept ne trouvent aucune province dans la tranche et s'arrêtent aussitôt.
#
# Deux plafonds se cumulent : le plan gratuit Cloudflare (50 sous-requêtes par exécution) et le
# rythme quotidien, global à TOUS les passages de la journée — voir le compteur `day:` en KV,
# sans quoi 7 passages feraient 7 fois le plafond. Ce rythme n'est PAS une constante : c'est
# une montée en charge datée, dans `dailySendCap()` (src/index.js) — 50/jour, puis 70 à partir
# du 15 août, 90 à partir du 22. Un domaine jeune qui saute d'un coup à 90 finit en spam ;
# c'est la seule raison d'être de ces paliers. La valeur du jour se lit dans le code, jamais
# ici — ce commentaire a déjà menti une fois (il annonçait 20 alors que le code servait 50).
# La vague mensuelle (~455 destinataires) s'étale ainsi sur environ trois semaines. Une fois
# tout le monde servi, plus rien jusqu'au 1er.
[triggers]
# ⚠ ÉLARGI LE 22 SEPT. 2026, ET C'EST LE LEVIER DE DÉBIT. Le frein n'a jamais été le
# plafond quotidien (6 000) ni la rampe (4 800) : c'est le budget KV d'UNE invocation —
# 880 opérations comptées, plafond Cloudflare à 1 000 — soit ~135 destinataires par
# passage. Sept passages plafonnaient donc la journée vers 900, quoi qu'on règle ailleurs.
# Vingt passages (toutes les demi-heures de 12 h à 21 h UTC) apportent vingt budgets.
# La demie ne sert PAS d'autres provinces : elle apporte un second budget aux mêmes.
# ⚠ 21 h UTC EST NÉCESSAIRE : 14 h locale en Colombie-Britannique. Et c'est sans danger,
# parce que le filtre qui protège est l'HEURE LOCALE (10, 11, 14), pas l'heure UTC — à
# 21 h UTC il est 17 h au Québec, donc le Québec n'est pas servi.
# ⚠ TOUTE MODIFICATION ICI DOIT SE REFLÉTER DANS `CRON_DERNIERE_HEURE_UTC` (src/index.js),
# sinon le partage du plafond compte des passages qui n'existent pas.
crons = ["0,30 12-21 * * *"]

# ── JOURNAUX (posé le 9 sept. 2026) ──────────────────────────────────────────────
# Sans ce bloc, `console.log` et `console.error` ne vont NULLE PART : ils ne sont visibles
# que dans un `wrangler tail` ouvert au moment même. Le 9 septembre, quatre passages du
# cron ont été tués à 30 s ; le `catch` ajouté la veille dans `scheduled()` et son
# « rapport zéro » écrivaient consciencieusement dans le vide, et il a fallu interroger
# l'API GraphQL d'analytique de Cloudflare pour découvrir que les passages de 14, 15, 16
# et 17 h UTC avaient duré 29,2 · 29,7 · 28,6 · 28,8 secondes.
# `head_sampling_rate = 1` : tout est retenu. Le worker fait quelques centaines de
# requêtes par jour — il n'y a rien à échantillonner, et un incident qui n'arrive qu'une
# fois est exactement celui qu'un échantillon rate.
[observability]
enabled = true
head_sampling_rate = 1
