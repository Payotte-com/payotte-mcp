name = "payotte-mcp"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Palier gratuit Cloudflare Workers : 100 000 requêtes/jour — largement suffisant.
# URL après déploiement : https://payotte-mcp.<sous-domaine>.workers.dev/mcp

# Compteurs anti-abus + comptage « leads IA » (agrégats seulement, jamais de contenu).
[[kv_namespaces]]
binding = "COUNTERS"
id = "773969ab7f814cdf8985b2f0e7edaf8d"

# Secrets attendus (wrangler secret put …) :
#   CONTACTS_TOKEN  — jeton du fichier /api/cx/{token}.json (src/lib/contactsToken.ts côté site)
#   RESEND_API_KEY  — clé API Resend ; ABSENTE = mode répétition (aucun envoi, réponse simulée)
[vars]
MAIL_FROM = "Payotte <relais@payotte.com>"
MAIL_FROM_BULLETIN = "Payotte <bulletin@payotte.com>"

# Abonnés au bulletin de marché mensuel (clé s:{ville}:{courriel} → {email, city, lang, consent}).
[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "6b341a2d876b49d78bb5651936ccac8e"

# Bulletin : cron QUOTIDIEN à 13h UTC (9h HE), pour un cycle MENSUEL.
# Deux plafonds se cumulent : le plan gratuit Cloudflare (50 sous-requêtes par exécution) et le
# rythme voulu (DAILY_SEND_CAP = 20/jour). La vague mensuelle (~455 destinataires) s'étale donc
# sur trois semaines, une petite tranche par jour. Une fois tout le monde servi, les exécutions
# du mois ne font plus rien jusqu'au 1er.
[triggers]
crons = ["0 13 * * *"]
